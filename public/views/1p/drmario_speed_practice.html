<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				padding: 0;
				margin: 0;
			}

			* {
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				box-sizing: border-box;
			}

			/* Solo practice layout: transparent throughout (like drmario_versus_drmc.html), meant
			   to be composited over the practicer's own camera capture in OBS. Unlike every other
			   Dr Mario view, only the left half of the 1280x720 frame is ever drawn into -- per
			   direct request, the right half is left clear for an optional camera source. */
			#stream_bg {
				position: relative;
				width: 1280px;
				height: 720px;
				overflow: hidden;
				color: #eee;
				display: flex;
				align-items: center;
			}

			#practice-column {
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				gap: 10px;
				padding: 28px;
				width: 560px;
			}

			/* Reused verbatim from drmario_speed.html -- see that file's own comments for the DrMC
			   reference-screenshot provenance. */
			.bar-pill {
				background: #0a0b0a;
				border-radius: 999px;
				padding: 4px 20px;
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.bar-pill p {
				margin: 0;
				font-weight: bold;
				color: #fff;
				font-size: 16px;
				white-space: nowrap;
			}

			.content-row {
				display: flex;
				align-items: flex-end;
				gap: 16px;
			}

			.side-box {
				background: #0a0b0a;
				border: 2px solid #64b7d5;
				border-radius: 4px;
				padding: 8px 12px;
				width: 90px;
				text-align: center;
				overflow: hidden;
			}

			.side-box-label {
				display: block;
				font-size: 11px;
				font-weight: bold;
				color: #aaa;
			}

			.side-box-value {
				display: block;
				font-size: 16px;
				font-weight: bold;
				color: #fff;
				margin-top: 2px;
			}

			.player-column {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 6px;
			}

			.top-strip {
				display: flex;
				background: #fff;
				border: 2px solid #64b7d5;
				border-radius: 4px;
				overflow: hidden;
			}

			.strip-box {
				padding: 3px 8px;
				display: flex;
				align-items: center;
				gap: 4px;
				border-right: 1px solid #64b7d5;
			}

			.strip-box:last-child {
				border-right: none;
			}

			.strip-label {
				font-weight: bold;
				font-size: 12px;
				color: #000;
			}

			.strip-value {
				font-weight: bold;
				font-size: 15px;
				color: #000;
			}

			.next-pill-canvas {
				background: #000;
				display: block;
			}

			.strip-box.next-pill-box {
				padding: 0;
			}

			.split-list {
				background: #0a0b0a;
				border: 2px solid #64b7d5;
				border-radius: 4px;
				padding: 6px 10px;
				min-width: 90px;
				font-size: 12px;
				color: #ccc;
				text-align: center;
				min-height: 14px;
			}

			.bottle-border-red {
				border: 3px solid #ee3434;
				display: inline-block;
				line-height: 0;
			}

			.bottle-border-cyan {
				border: 3px solid #64b7d5;
				display: inline-block;
				line-height: 0;
			}

			.bottle-border-gold {
				border: 2px solid #ebb423;
				display: inline-block;
				line-height: 0;
			}

			.board-wrap {
				position: relative;
				display: inline-block;
				line-height: 0;
			}

			.board-canvas {
				display: block;
				background: #000;
			}

			.freeze-overlay {
				position: absolute;
				inset: 0;
				background: rgba(15, 15, 15, 0.8);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 10px;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.4s;
				text-align: center;
				padding: 12px;
				line-height: normal;
			}

			.freeze-overlay.visible {
				opacity: 1;
			}

			.freeze-outcome {
				margin: 0;
				font-weight: bold;
				font-size: 22px;
				color: #ff0;
			}

			.freeze-stats {
				display: flex;
				flex-direction: column;
				gap: 3px;
			}

			.freeze-stats p {
				margin: 0;
				font-size: 13px;
				color: #ddd;
			}

			.rush {
				color: #f80;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<div id="stream_bg">
			<div id="practice-column">
				<div class="bar-pill"><p id="level-set-label"></p></div>

				<div class="content-row">
					<div class="side-box" id="side-box">
						<span class="side-box-label">PILLS/MIN</span>
						<span class="side-box-value">0.0</span>
					</div>

					<div class="player-column">
						<div class="top-strip">
							<div class="strip-box">
								<span class="strip-label">VIR</span>
								<span class="strip-value" id="vir">?</span>
							</div>
							<div class="strip-box next-pill-box">
								<canvas class="next-pill-canvas" id="next"></canvas>
							</div>
							<div class="strip-box">
								<span class="strip-label">SPD</span>
								<span class="strip-value" id="spd">?</span>
							</div>
							<div class="strip-box">
								<span class="strip-label">TIME</span>
								<span class="strip-value" id="time">--:--</span>
							</div>
						</div>
						<div class="bottle-border-red">
							<div class="bottle-border-cyan">
								<div class="bottle-border-gold">
									<div class="board-wrap">
										<canvas class="board-canvas" id="board"></canvas>
										<div class="freeze-overlay" id="freeze">
											<p class="freeze-outcome" id="freeze-outcome"></p>
											<div class="freeze-stats" id="freeze-stats">
												<p>Total: <span id="freeze-total"></span></p>
												<p>Pills/min: <span id="freeze-ppm"></span></p>
												<p>Viruses/min: <span id="freeze-vpm"></span></p>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
						<div class="split-list" id="splits"></div>
					</div>
				</div>
			</div>
		</div>

		<script type="module">
			import Connection from '/js/connection.js';
			import RoundTracker from '/producer/drmario/RoundTracker.js';
			import LiveMetrics from '/producer/drmario/LiveMetrics.js';
			import SpeedRunTracker from '/producer/drmario/SpeedRunTracker.js';
			import { calculateInternalSpeed } from '/producer/drmario/InternalSpeed.js';
			import {
				drawCell,
				currentVirusFrame,
			} from '/producer/drmario/CellRenderer.js';
			import {
				COLOR_PALETTE,
				COLS,
				ROWS,
			} from '/producer/drmario/constants.js';

			// Same as every other Dr Mario view -- the WS paths live in their own namespace, so
			// this can't rely on Connection()'s "derive it from location.pathname" convenience.
			// Attaches to the practicer's own private room, exactly like drmario_single(_nes).html
			// -- this connection also receives whatever practice_admin.html sends (see its own
			// speedPracticeSetLevelSet/speedPracticeResetRun handlers in the API object below),
			// since that page relays straight into this same private room server-side.
			const [, , layout, secret] = location.pathname.split('/');
			const wsProtocol = location.protocol.match(/^https/i) ? 'wss:' : 'ws:';
			const connection = new Connection(
				`${wsProtocol}//${location.host}/ws/view/drmario/${layout}/${secret}`
			);

			const tracker = new RoundTracker();

			let piecesEnteredThisRound = 0;
			tracker.addEventListener('round_start', () => {
				piecesEnteredThisRound = 0;
			});
			tracker.addEventListener('piece_entered', () => {
				piecesEnteredThisRound++;
			});

			// carryAcrossLevels: true, same reasoning as drmario_single(_nes).html/drmario_speed.html
			// -- a level clear advances to a harder level within the same run, it isn't a fresh
			// playthrough, so rate/streak/drought stats shouldn't reset on every one.
			const stats = new LiveMetrics(tracker, { carryAcrossLevels: true });
			const speedTracker = new SpeedRunTracker(tracker);

			// --- Level set config -----------------------------------------------------------------
			// Driven by practice_admin.html over this same connection (speedPracticeSetLevelSet/
			// speedPracticeResetRun messages, handled in the API object below) rather than on-page
			// controls -- an earlier version had the config panel directly on this page, but that
			// was reported live as awkward to reach in OBS (only reachable via Interact mode on the
			// broadcast source itself). Still persisted to localStorage so a reload of this OBS
			// source (or a plain page refresh) remembers the last-applied level set even if the
			// admin page isn't currently open to resend it.

			const LEVEL_SET_KEY = 'drmario_speed_practice_level_set';

			let levelSet = [];

			function renderLevelSetLabel() {
				const el = document.getElementById('level-set-label');
				el.textContent = !levelSet.length
					? ''
					: levelSet.length === 1
						? `LEVEL ${levelSet[0]}`
						: `LEVELS ${levelSet[0]}-${levelSet[levelSet.length - 1]}`;
			}

			function applyLevelSet(levels) {
				localStorage.setItem(LEVEL_SET_KEY, JSON.stringify(levels));
				levelSet = levels;
				renderLevelSetLabel();
				speedTracker.setLevelSet(levelSet);
				resetDisplay();
				renderSplitList();
			}

			// --- Board-freeze/lookback on run completion ------------------------------------------
			// Reused verbatim from drmario_speed.html (see its own header comments for the full
			// reasoning) -- single-player here, so no per-suffix bookkeeping needed. Once the level
			// set is fully cleared, the SpeedRunTracker reaches 'complete' but the real NES game
			// keeps going regardless (it has no idea the configured set ended) and will keep firing
			// further round_start events -- stays frozen through those until an explicit reset.

			let roundEnded = false;
			let raceComplete = false;
			let latestRunSnapshot = null;
			let latestStatsSnapshot = null;

			const BOARD_LOOKBACK_FRAMES = { topout: 1, game_over: 4 };
			const DEFAULT_BOARD_LOOKBACK_FRAMES = 2;
			const BOARD_HISTORY_SIZE =
				Math.max(...Object.values(BOARD_LOOKBACK_FRAMES)) + 1;
			let boardHistory = [];

			const CLEARING_MAX_UNKNOWN_CELLS = 3;
			let lastClearingBoard = null;

			function recordBoardHistory(board) {
				boardHistory.push(board);
				if (boardHistory.length > BOARD_HISTORY_SIZE) boardHistory.shift();

				const cells = board.flat();
				const hasClearing = cells.some(cell => cell?.type === 'clearing');
				const unknownCount = cells.filter(
					cell => cell?.type === 'unknown'
				).length;
				if (hasClearing && unknownCount < CLEARING_MAX_UNKNOWN_CELLS) {
					lastClearingBoard = board;
				}
			}

			function freezeOnEarlierBoard(outcome) {
				if (outcome === 'stage_clear' && lastClearingBoard) {
					renderBoard(document.getElementById('board'), lastClearingBoard);
					return;
				}

				if (boardHistory.length === 0) return;

				const lookback =
					BOARD_LOOKBACK_FRAMES[outcome] ?? DEFAULT_BOARD_LOOKBACK_FRAMES;
				const index = Math.max(0, boardHistory.length - 1 - lookback);
				renderBoard(document.getElementById('board'), boardHistory[index]);
			}

			tracker.addEventListener('round_end', e => {
				roundEnded = true;
				freezeOnEarlierBoard(e.detail.outcome);
			});
			tracker.addEventListener('round_start', () => {
				if (raceComplete) return; // stay frozen until an explicit reset
				roundEnded = false;
				boardHistory = [];
				lastClearingBoard = null;
			});

			function resetDisplay() {
				roundEnded = false;
				boardHistory = [];
				lastClearingBoard = null;
				renderBoard(document.getElementById('board'), null);
			}

			// --- Split list, live timer -------------------------------------------------------------

			function formatTime(ms) {
				if (ms == null) return '--:--';
				const totalSeconds = Math.floor(ms / 1000);
				const m = Math.floor(totalSeconds / 60);
				const s = totalSeconds % 60;
				return `${m}:${String(s).padStart(2, '0')}`;
			}

			function renderTimeBox(elapsedMs) {
				document.getElementById('time').textContent = formatTime(elapsedMs);
			}

			// Each level's own duration (this level's cumulative split minus the previous level's),
			// not the running total -- same convention as drmario_speed.html's split list, minus the
			// other-player comparison annotation (no opponent here).
			function renderSplitList() {
				const snapshot = latestRunSnapshot;
				const el = document.getElementById('splits');

				if (!snapshot || !levelSet.length) {
					el.innerHTML = '';
					return;
				}

				el.innerHTML = levelSet
					.map((level, index) => {
						const cumulative = snapshot.splits[level];
						if (cumulative == null) return `<div>${level}: --:--</div>`;

						const previousLevel = index > 0 ? levelSet[index - 1] : null;
						const previousCumulative =
							previousLevel != null ? (snapshot.splits[previousLevel] ?? 0) : 0;
						const levelTime = cumulative - previousCumulative;

						return `<div>${level}: ${formatTime(levelTime)}</div>`;
					})
					.join('');
			}

			function updateFreezeOverlay() {
				const overlayEl = document.getElementById('freeze');
				overlayEl.classList.toggle('visible', raceComplete);

				if (!raceComplete) return;

				document.getElementById('freeze-outcome').textContent = 'FINISHED';

				document.getElementById('freeze-total').textContent = formatTime(
					latestRunSnapshot?.elapsedMs
				);

				const s = latestStatsSnapshot;
				document.getElementById('freeze-ppm').textContent = s
					? s.piecesPerMinute.toFixed(1)
					: '?';
				document.getElementById('freeze-vpm').textContent = s
					? s.virusClearsPerMinute.toFixed(1)
					: '?';
			}

			speedTracker.addEventListener('run_updated', e => {
				latestRunSnapshot = e.detail;
				raceComplete = e.detail.status === 'complete';

				renderTimeBox(e.detail.elapsedMs);
				renderSplitList();
				updateFreezeOverlay();
			});

			// Ticks the live timer smoothly between discrete RoundTracker events, same cadence as
			// drmario_speed.html's own (neither RoundTracker nor SpeedRunTracker emits on a
			// wall-clock cadence by itself).
			setInterval(() => {
				if (latestRunSnapshot?.status === 'in_progress') {
					renderTimeBox(Date.now() - latestRunSnapshot.runStartTime);
				}
			}, 250);

			// --- Side stat box (pills/min by default, drought/rush callout when active) -----------

			const DROUGHT_DISPLAY_THRESHOLD = 5;

			function rgbFor(colorName) {
				const rgb = COLOR_PALETTE[colorName];
				return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
			}

			function worstDrought(colorDroughts) {
				const [color, count] = Object.entries(colorDroughts).reduce(
					(best, cur) => (cur[1] > best[1] ? cur : best)
				);
				return count < DROUGHT_DISPLAY_THRESHOLD ? null : { color, count };
			}

			function renderSideBox(s) {
				const el = document.getElementById('side-box');
				if (s.isRushing) {
					el.innerHTML = `<span class="side-box-label rush">RUSH</span><span class="side-box-value rush">x${s.rushStreak}</span>`;
					return;
				}
				const drought = worstDrought(s.colorDroughts);
				if (drought) {
					const color = rgbFor(drought.color);
					el.innerHTML = `<span class="side-box-label" style="color: ${color}">DROUGHT</span><span class="side-box-value" style="color: ${color}">x${drought.count}</span>`;
					return;
				}
				el.innerHTML = `<span class="side-box-label">PILLS/MIN</span><span class="side-box-value">${s.piecesPerMinute.toFixed(1)}</span>`;
			}

			stats.addEventListener('stats_updated', e => {
				if (raceComplete) return; // frozen -- don't let numbers drift post-run
				latestStatsSnapshot = e.detail;
				renderSideBox(e.detail);
			});

			// --- Bottle/next-pill rendering (sprite-accurate, via CellRenderer.js) ----------------

			const CELL_PX = 28;
			const NEXT_PILL_CELL_PX = 16;

			function renderBoard(canvas, board) {
				const ctx = canvas.getContext('2d');
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				if (!board) return;

				const virusFrame = currentVirusFrame();
				board.forEach((row, rowIdx) => {
					row.forEach((cell, colIdx) => {
						drawCell(
							ctx,
							colIdx * CELL_PX,
							rowIdx * CELL_PX,
							CELL_PX,
							cell,
							virusFrame
						);
					});
				});
			}

			function renderNextPill(canvas, nextPill) {
				const ctx = canvas.getContext('2d');
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				if (!nextPill) return;

				const virusFrame = currentVirusFrame();
				drawCell(ctx, 0, 0, NEXT_PILL_CELL_PX, nextPill.left, virusFrame);
				drawCell(
					ctx,
					NEXT_PILL_CELL_PX,
					0,
					NEXT_PILL_CELL_PX,
					nextPill.right,
					virusFrame
				);
			}

			const boardCanvas = document.getElementById('board');
			boardCanvas.width = COLS * CELL_PX;
			boardCanvas.height = ROWS * CELL_PX;

			const nextPillCanvas = document.getElementById('next');
			nextPillCanvas.width = 2 * NEXT_PILL_CELL_PX;
			nextPillCanvas.height = NEXT_PILL_CELL_PX;

			function renderFrame(data) {
				if (!roundEnded && data.board) {
					renderBoard(document.getElementById('board'), data.board);
					recordBoardHistory(data.board);
				}

				renderNextPill(document.getElementById('next'), data.nextPill);

				const internalSpeed = calculateInternalSpeed(
					data.speed,
					piecesEnteredThisRound
				);
				document.getElementById('vir').textContent = data.virus ?? '?';
				document.getElementById('spd').textContent = internalSpeed ?? '?';

				tracker.processFrame(data);
			}

			const API = {
				frame(_player_idx, data) {
					if (data.layout === 'single_player') renderFrame(data);
				},
				// From practice_admin.html -- see routes/websocket.js's practice-admin relay
				// (a dumb sendToViews() broadcast, so this view is responsible for only reacting to
				// the commands it recognizes; drmario_qualify_practice.html's own admin commands use
				// distinct names precisely so the two views attached to the same room never trigger
				// each other).
				speedPracticeSetLevelSet(levels) {
					applyLevelSet(levels);
				},
				speedPracticeResetRun() {
					speedTracker.reset();
					resetDisplay();
				},
				message() {}, // noop -- chat messages, same as every other Dr Mario view
			};

			connection.onMessage = function (frame) {
				try {
					const [method, ...args] = frame;
					API[method]?.apply(API, args);
				} catch (e) {
					console.error(e);
				}
			};

			// Run last, after every function/state above this point has been defined -- applying
			// a level set immediately calls into resetDisplay() (board-freeze state) and
			// renderSplitList()/renderBoard(), which reference `let` bindings declared further down
			// this same module scope; calling this any earlier throws a "before initialization"
			// error that aborts the whole script before connection.onMessage above is even
			// assigned, silently breaking the entire view (confirmed live). Seeds a starting level
			// set from whatever was last applied (so this view isn't blank before practice_admin
			// .html ever connects, e.g. right after an OBS restart) -- the admin's own
			// speedPracticeSetLevelSet command, handled above, can always override it later.
			let savedLevelSet = null;
			try {
				savedLevelSet = JSON.parse(localStorage.getItem(LEVEL_SET_KEY));
			} catch (_err) {
				// ignore -- falls through to the default below
			}
			applyLevelSet(
				Array.isArray(savedLevelSet) && savedLevelSet.length
					? savedLevelSet
					: [0, 1, 2, 3]
			);
		</script>
	</body>
</html>
