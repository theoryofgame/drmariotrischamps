<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				padding: 0;
				margin: 0;
			}

			* {
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				box-sizing: border-box;
			}

			#stream_bg {
				position: relative;
				width: 1280px;
				height: 720px;
				overflow: hidden;
				background: #111;
				color: #eee;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 64px;
			}

			.player {
				text-align: center;
			}

			.player h2 {
				margin: 0 0 8px;
				font-size: 28px;
			}

			.round-state {
				font-weight: bold;
				color: #ff0;
				min-height: 1.4em;
				font-size: 20px;
			}

			.board-grid {
				display: grid;
				gap: 1px;
				background: #333;
				border: 2px solid #666;
				width: max-content;
				margin: 0 auto;
			}

			.board-cell {
				width: 20px;
				height: 20px;
			}

			.next-pill-cell {
				display: inline-block;
				width: 24px;
				height: 24px;
				margin-right: 2px;
				border: 1px solid #666;
				vertical-align: middle;
			}

			.stats {
				font-size: 16px;
				color: #ccc;
				margin-top: 8px;
			}

			.rush {
				color: #f80;
				font-weight: bold;
			}

			.drought {
				font-weight: bold;
			}

			#crowns {
				position: absolute;
				top: 16px;
				left: 50%;
				transform: translateX(-50%);
				font-size: 20px;
				font-weight: bold;
			}

			#round-timer {
				position: absolute;
				top: 44px;
				left: 50%;
				transform: translateX(-50%);
				font-size: 16px;
				color: #ccc;
			}
		</style>
	</head>
	<body>
		<div id="stream_bg">
			<p id="crowns"></p>
			<p id="round-timer"></p>

			<div class="player">
				<h2>Player 1</h2>
				<p class="round-state" id="round-1p"></p>
				<div id="board-1p"></div>
				<p>Next: <span id="next-1p"></span></p>
				<p class="stats" id="stats-1p"></p>
				<p class="stats" id="run-stats-1p"></p>
				<p class="stats" id="garbage-stats-1p"></p>
			</div>

			<div class="player">
				<h2>Player 2</h2>
				<p class="round-state" id="round-2p"></p>
				<div id="board-2p"></div>
				<p>Next: <span id="next-2p"></span></p>
				<p class="stats" id="stats-2p"></p>
				<p class="stats" id="run-stats-2p"></p>
				<p class="stats" id="garbage-stats-2p"></p>
			</div>
		</div>

		<script type="module">
			import Connection from '/js/connection.js';
			import RoundTracker from '/producer/drmario/RoundTracker.js';
			import LiveMetrics from '/producer/drmario/LiveMetrics.js';
			import { COLOR_PALETTE } from '/producer/drmario/constants.js';

			// The Dr Mario producer/view WS paths live in their own namespace, separate from
			// Tetris's -- so unlike every Tetris layout, this page can't just rely on
			// Connection()'s "derive the ws:// URL from location.pathname" convenience (that
			// would produce /ws/view/drmario_versus/<secret>, not this namespace's
			// /ws/view/drmario/<layout>/<secret> -- see routes/websocket.js). Build the URL
			// explicitly from the same path segments instead.
			const [, , layout, secret] = location.pathname.split('/');
			const wsProtocol = location.protocol.match(/^https/i) ? 'wss:' : 'ws:';
			const connection = new Connection(
				`${wsProtocol}//${location.host}/ws/view/drmario/${layout}/${secret}`
			);

			const trackers = {
				player1: new RoundTracker(),
				player2: new RoundTracker(),
			};

			// Same shared-round-boundary wiring as the producer's own operator-facing trackers
			// (see producer.js) -- see RoundTracker.js's header comment for why both endRound()
			// and syncRoundStart() are needed, not just one.
			trackers.player1.addEventListener('round_end', event =>
				trackers.player2.endRound(`opponent_${event.detail.outcome}`)
			);
			trackers.player2.addEventListener('round_end', event =>
				trackers.player1.endRound(`opponent_${event.detail.outcome}`)
			);
			trackers.player1.addEventListener('round_start', event =>
				trackers.player2.syncRoundStart({ roundId: event.detail.roundId })
			);
			trackers.player2.addEventListener('round_start', event =>
				trackers.player1.syncRoundStart({ roundId: event.detail.roundId })
			);

			// Round timer: versus's round boundary is shared (see the cross-wiring above), so both
			// trackers' round_start/round_end fire for the same roundId within a frame or two of
			// each other -- the roundId dedup below just means "first one wins" rather than double-
			// resetting/re-freezing on the second tracker's own copy of the same transition. Freezes
			// at whatever it last showed once a round ends, rather than blanking, so the final split
			// stays readable until the next round_start resets it.
			const roundTimerEl = document.getElementById('round-timer');
			let roundStartTime = null;
			let roundActive = false;
			let currentRoundId = null;

			function handleRoundStart(detail) {
				if (roundActive && detail.roundId === currentRoundId) return;
				currentRoundId = detail.roundId;
				roundStartTime = Date.now();
				roundActive = true;
				roundTimerEl.textContent = '0:00';
			}

			function handleRoundEnd() {
				roundActive = false;
			}

			trackers.player1.addEventListener('round_start', e =>
				handleRoundStart(e.detail)
			);
			trackers.player2.addEventListener('round_start', e =>
				handleRoundStart(e.detail)
			);
			trackers.player1.addEventListener('round_end', handleRoundEnd);
			trackers.player2.addEventListener('round_end', handleRoundEnd);

			setInterval(() => {
				if (!roundActive) return;
				const totalSeconds = Math.floor((Date.now() - roundStartTime) / 1000);
				const m = Math.floor(totalSeconds / 60);
				const s = totalSeconds % 60;
				roundTimerEl.textContent = `${m}:${String(s).padStart(2, '0')}`;
			}, 250);

			// carryAcrossLevels defaults to false (versus's simpler per-round reset -- see
			// LiveMetrics.js's header comment; versus has no "advance to a harder level, same
			// run" concept the way single-player does).
			const stats = {
				player1: new LiveMetrics(trackers.player1),
				player2: new LiveMetrics(trackers.player2),
			};

			// Garbage a wave sent to the OPPONENT's bottle is credited to the SENDER's own stats
			// -- same cross-player coordination pattern as endRound()/syncRoundStart() above, just
			// on garbage_entered instead of round_start/round_end.
			trackers.player1.addEventListener('garbage_entered', event =>
				stats.player2.recordGarbageSent({
					cellCount: event.detail.cells.length,
					maxRestRows: event.detail.maxRestRows,
				})
			);
			trackers.player2.addEventListener('garbage_entered', event =>
				stats.player1.recordGarbageSent({
					cellCount: event.detail.cells.length,
					maxRestRows: event.detail.maxRestRows,
				})
			);

			// Droughts are only worth calling out once they're notable -- below this, the raw
			// counts are still tracked (see LiveMetrics.js), just not surfaced here.
			const DROUGHT_DISPLAY_THRESHOLD = 5;

			function rgbFor(colorName) {
				const rgb = COLOR_PALETTE[colorName];
				return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
			}

			// Same selective treatment as rush: silent unless there's something worth flagging. Only
			// the worst-drought color is shown (of the 3 colors, more than one can cross the
			// threshold at once if a single color has been spawning repeatedly), colored to match
			// that color's own pill so it reads at a glance without a label.
			function droughtStatusHtml(colorDroughts) {
				const [color, count] = Object.entries(colorDroughts).reduce(
					(best, cur) => (cur[1] > best[1] ? cur : best)
				);
				if (count < DROUGHT_DISPLAY_THRESHOLD) return '';
				return `<span class="drought" style="color: ${rgbFor(color)}">${color.toUpperCase()} DROUGHT x${count}</span>`;
			}

			// The round-state element (top of each bottle -- where STAGE CLEAR/GAME OVER/TOPOUT
			// show) doubles as the rush/drought callout while a round is just in ordinary play: the
			// game's own state naturally takes priority (a round actually ending is more important
			// than a drought), and the two can never really compete for attention since round-state
			// text only ever appears when result isn't 'playing', exactly when there's nothing to
			// show here anyway.
			const latestResult = { '1p': null, '2p': null };
			const latestStatusHtml = { '1p': '', '2p': '' };

			function updateRoundStateDisplay(playerKey) {
				const element = document.getElementById(`round-${playerKey}`);
				const state = latestResult[playerKey];
				if (state === 'playing' || state === null) {
					element.innerHTML = latestStatusHtml[playerKey];
				} else {
					element.textContent = state.replace('_', ' ').toUpperCase();
				}
			}

			function renderStats(playerKey, s) {
				latestStatusHtml[playerKey] = s.isRushing
					? `<span class="rush">RUSH x${s.rushStreak}!</span>`
					: droughtStatusHtml(s.colorDroughts);
				updateRoundStateDisplay(playerKey);

				document.getElementById(`run-stats-${playerKey}`).textContent =
					`${s.piecesPerMinute.toFixed(1)} pieces/min / ${s.virusClearsPerMinute.toFixed(1)} virus/min`;
				document.getElementById(`garbage-stats-${playerKey}`).textContent =
					`Combos: ${s.garbageWavesSent} (${s.garbageWavesSentPerMinute.toFixed(1)}/min) / CUR ${s.averageGarbageWaveSize.toFixed(1)} / SALT ${s.saltSeconds.toFixed(2)}s`;
			}

			stats.player1.addEventListener('stats_updated', e =>
				renderStats('1p', e.detail)
			);
			stats.player2.addEventListener('stats_updated', e =>
				renderStats('2p', e.detail)
			);

			function colorFor(cell) {
				if (!cell || cell.type === 'empty') return '#000';
				if (cell.type === 'unknown') return '#888';

				const rgb = COLOR_PALETTE[cell.color];
				return rgb ? `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})` : '#f0f';
			}

			function backgroundFor(cell) {
				const color = colorFor(cell);
				if (!cell) return color;

				if (cell.type === 'virus') {
					return `radial-gradient(circle at center, #000 22%, ${color} 23%)`;
				}

				if (cell.type === 'clearing') {
					return `radial-gradient(circle at center, #000 40%, ${color} 41%, ${color} 75%, #000 76%)`;
				}

				return color;
			}

			function renderBoard(container, board) {
				container.innerHTML = '';

				if (!board) return;

				container.className = 'board-grid';
				container.style.gridTemplateColumns = `repeat(${board[0].length}, 20px)`;

				board.flat().forEach(cell => {
					const div = document.createElement('div');
					div.className = 'board-cell';
					div.style.background = backgroundFor(cell);
					container.appendChild(div);
				});
			}

			function renderNextPill(container, nextPill) {
				container.innerHTML = '';

				if (!nextPill) return;

				['left', 'right'].forEach(slot => {
					const span = document.createElement('span');
					span.className = 'next-pill-cell';
					span.style.background = colorFor(nextPill[slot]);
					container.appendChild(span);
				});
			}

			function renderFrame(data) {
				latestResult['1p'] = data.player1.result;
				latestResult['2p'] = data.player2.result;
				updateRoundStateDisplay('1p');
				updateRoundStateDisplay('2p');

				renderBoard(document.getElementById('board-1p'), data.player1.board);
				renderBoard(document.getElementById('board-2p'), data.player2.board);
				renderNextPill(
					document.getElementById('next-1p'),
					data.player1.nextPill
				);
				renderNextPill(
					document.getElementById('next-2p'),
					data.player2.nextPill
				);

				document.getElementById('stats-1p').textContent =
					`Level ${data.player1.level ?? '?'} / Speed ${data.player1.speed ?? '?'} / Virus ${data.player1.virus ?? '?'}`;
				document.getElementById('stats-2p').textContent =
					`Level ${data.player2.level ?? '?'} / Speed ${data.player2.speed ?? '?'} / Virus ${data.player2.virus ?? '?'}`;
				document.getElementById('crowns').textContent =
					`P1 ${data.crowns.player1.wins} -- P2 ${data.crowns.player2.wins}`;

				trackers.player1.processFrame(data.player1);
				trackers.player2.processFrame(data.player2);
			}

			const API = {
				frame(_player_idx, data) {
					if (data.layout === 'versus') renderFrame(data);
				},
				message() {}, // noop
			};

			connection.onMessage = function (frame) {
				try {
					const [method, ...args] = frame;
					API[method]?.apply(API, args);
				} catch (e) {
					console.error(e);
				}
			};
		</script>
	</body>
</html>
