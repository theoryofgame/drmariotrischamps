<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				padding: 0;
				margin: 0;
			}

			* {
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				box-sizing: border-box;
			}

			#stream_bg {
				width: 1280px;
				height: 720px;
				overflow: hidden;
				background: #111;
				color: #eee;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.player {
				text-align: center;
			}

			.round-state {
				font-weight: bold;
				color: #ff0;
				min-height: 1.4em;
				font-size: 20px;
			}

			.board-canvas {
				background: #000;
				border: 2px solid #666;
			}

			.next-pill-canvas {
				background: #000;
				border: 1px solid #666;
				vertical-align: middle;
			}

			.stats {
				font-size: 16px;
				color: #ccc;
				margin-top: 8px;
			}

			.rush {
				color: #f80;
				font-weight: bold;
			}

			.drought {
				font-weight: bold;
			}

			#reset-run {
				position: absolute;
				bottom: 12px;
				right: 12px;
				font-size: 12px;
				opacity: 0.5;
			}
		</style>
	</head>
	<body>
		<div id="stream_bg">
			<div class="player">
				<p class="round-state" id="round-sp"></p>
				<canvas class="board-canvas" id="board-sp"></canvas>
				<p>Next: <canvas class="next-pill-canvas" id="next-sp"></canvas></p>
				<p class="stats" id="stats-sp"></p>
				<p class="stats" id="run-stats"></p>
			</div>
		</div>

		<button id="reset-run">Reset run stats</button>

		<script type="module">
			import Connection from '/js/connection.js';
			import RoundTracker from '/producer/drmario/RoundTracker.js';
			import LiveMetrics from '/producer/drmario/LiveMetrics.js';
			import { calculateInternalSpeed } from '/producer/drmario/InternalSpeed.js';
			import {
				drawCell,
				currentVirusFrame,
			} from '/producer/drmario/CellRenderer.js';
			import {
				COLOR_PALETTE,
				COLS,
				ROWS,
			} from '/producer/drmario/constants.js';

			// See drmario_versus_nes.html's comment -- the Dr Mario producer/view WS paths live
			// in their own namespace, so this page builds the ws:// URL explicitly rather than
			// relying on Connection()'s usual "derive it from location.pathname" convenience.
			const [, , layout, secret] = location.pathname.split('/');
			const wsProtocol = location.protocol.match(/^https/i) ? 'wss:' : 'ws:';
			const connection = new Connection(
				`${wsProtocol}//${location.host}/ws/view/drmario/${layout}/${secret}`
			);

			// Single-player has no shared round boundary to sync across bottles the way versus
			// does (see RoundTracker.js's header comment) -- just the one instance.
			const tracker = new RoundTracker();

			// The displayed LOW/MED/HI speed isn't the game's real internal fall-speed -- see
			// InternalSpeed.js. That calculation needs a running count of pills entered since the
			// current round started, which (unlike LiveMetrics' own piece count) always resets on
			// round_start regardless of carryAcrossLevels: the real game's own speed ramp genuinely
			// restarts every level, it isn't a "run" concept.
			let piecesEnteredThisRound = 0;
			tracker.addEventListener('round_start', () => {
				piecesEnteredThisRound = 0;
			});
			tracker.addEventListener('piece_entered', () => {
				piecesEnteredThisRound++;
			});

			// carryAcrossLevels: single-player's round boundary fires on every level (a
			// stage_clear just advances to a harder one, same playthrough) -- see LiveMetrics.js's
			// header comment for why rate/streak/drought stats need to span the whole playthrough
			// rather than resetting on every level-up.
			const stats = new LiveMetrics(tracker, { carryAcrossLevels: true });
			const runStatsEl = document.getElementById('run-stats');

			// Droughts are only worth calling out once they're notable -- below this, the raw
			// counts are still tracked (see LiveMetrics.js), just not surfaced here.
			const DROUGHT_DISPLAY_THRESHOLD = 5;

			function rgbFor(colorName) {
				const rgb = COLOR_PALETTE[colorName];
				return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
			}

			// Same selective treatment as rush: silent unless there's something worth flagging. Only
			// the worst-drought color is shown (of the 3 colors, more than one can cross the
			// threshold at once if a single color has been spawning repeatedly), colored to match
			// that color's own pill so it reads at a glance without a label.
			function droughtStatusHtml(colorDroughts) {
				const [color, count] = Object.entries(colorDroughts).reduce(
					(best, cur) => (cur[1] > best[1] ? cur : best)
				);
				if (count < DROUGHT_DISPLAY_THRESHOLD) return '';
				return `<span class="drought" style="color: ${rgbFor(color)}">${color.toUpperCase()} DROUGHT x${count}</span>`;
			}

			stats.addEventListener('stats_updated', event => {
				const s = event.detail;
				const statusHtml = s.isRushing
					? `<span class="rush">RUSH x${s.rushStreak}!</span>`
					: droughtStatusHtml(s.colorDroughts);
				runStatsEl.innerHTML = `${s.piecesPerMinute.toFixed(1)} pieces/min / ${s.virusClearsPerMinute.toFixed(1)} virus/min${statusHtml ? ` -- ${statusHtml}` : ''}`;
			});

			document.getElementById('reset-run').addEventListener('click', () => {
				stats.resetRun();
			});

			// The bottle grid and next-pill preview both render real NES sprite art via
			// CellRenderer.js (pill halves/singles, animated viruses) instead of flat colored
			// squares -- see CLAUDE.md's notes on this layout for why this exists as a separate
			// file rather than replacing drmario_single.html in place. Stats text and the round-
			// state banner intentionally still use plain text/CSS -- explicitly out of scope.
			const CELL_PX = 24; // 3x the native 8px NES tile -- a clean integer scale

			function renderBoard(canvas, board) {
				const ctx = canvas.getContext('2d');
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				if (!board) return;

				const virusFrame = currentVirusFrame();
				board.forEach((row, rowIdx) => {
					row.forEach((cell, colIdx) => {
						drawCell(
							ctx,
							colIdx * CELL_PX,
							rowIdx * CELL_PX,
							CELL_PX,
							cell,
							virusFrame
						);
					});
				});
			}

			// A next-pill preview is always a plain horizontal pill -- BoardOCR.identifyNextPill()
			// already returns nextPill.left/right as full cell-shaped objects ({type: 'pill',
			// shape: 'left'/'right', color}), so they can go straight into drawCell() with no
			// translation, the same as a real board cell. virusFrame is passed along purely for a
			// consistent drawCell() call shape -- a pill never uses it.
			function renderNextPill(canvas, nextPill) {
				const ctx = canvas.getContext('2d');
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				if (!nextPill) return;

				const virusFrame = currentVirusFrame();
				drawCell(ctx, 0, 0, CELL_PX, nextPill.left, virusFrame);
				drawCell(ctx, CELL_PX, 0, CELL_PX, nextPill.right, virusFrame);
			}

			function renderRoundState(element, state) {
				if (state === 'playing' || state === null) {
					element.textContent = '';
				} else {
					element.textContent = state.replace('_', ' ').toUpperCase();
				}
			}

			function renderFrame(data) {
				renderRoundState(document.getElementById('round-sp'), data.result);
				renderBoard(document.getElementById('board-sp'), data.board);
				renderNextPill(document.getElementById('next-sp'), data.nextPill);

				const internalSpeed = calculateInternalSpeed(
					data.speed,
					piecesEnteredThisRound
				);
				document.getElementById('stats-sp').textContent =
					`Top ${data.top ?? '?'} / Score ${data.score ?? '?'} / Level ${data.level ?? '?'} / Speed ${internalSpeed ?? '?'} / Virus ${data.virus ?? '?'}`;

				tracker.processFrame(data);
			}

			// Board/next-pill canvases are sized here (not via HTML width/height attributes) so
			// COLS/ROWS/CELL_PX all come from one place.
			const boardCanvas = document.getElementById('board-sp');
			boardCanvas.width = COLS * CELL_PX;
			boardCanvas.height = ROWS * CELL_PX;

			const nextPillCanvas = document.getElementById('next-sp');
			nextPillCanvas.width = 2 * CELL_PX;
			nextPillCanvas.height = CELL_PX;

			const API = {
				frame(_player_idx, data) {
					if (data.layout === 'single_player') renderFrame(data);
				},
				message() {}, // noop
			};

			connection.onMessage = function (frame) {
				try {
					const [method, ...args] = frame;
					API[method]?.apply(API, args);
				} catch (e) {
					console.error(e);
				}
			};
		</script>
	</body>
</html>
